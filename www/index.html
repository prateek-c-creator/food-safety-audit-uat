<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14285a"><title>Food Safety Audit (UAT)</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Food Safety">
<style>
*{box-sizing:border-box}body{margin:0}button,input,textarea{font-family:inherit}
/* Layout: native-app feel. Navy title bar, grey grouped lists with white rows, bottom tab bar on the
   main screens, and a push-style checklist with a fixed score bar. Scores are set with a round dial
   that opens a bottom sheet holding a cylinder wheel picker. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --ink:#1c1c1e; --muted:#6c6c70; --sep:rgba(60,60,67,.16);
  --nav:#14285a; --nav-ink:#ffffff; --gold:#f2b705;
  --primary:#14285a; --primary-ink:#ffffff; --link:#1f56c4; --tint:rgba(31,86,196,.1);
  --good:#1a8f4d; --good-soft:#e2f4ea; --warn:#b36b00; --warn-soft:#fdf0d8; --bad:#d02a1f; --bad-soft:#fde8e5;
  --good-s:#1f9d55; --warn-s:#d98300; --bad-s:#d92d20; --on-s:#ffffff;
  --fill:rgba(118,118,128,.12); --seg-on:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.06);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --ink:#f2f2f7; --muted:#98989f; --sep:rgba(255,255,255,.14);
    --nav:#0f1a3d; --nav-ink:#ffffff;
    --primary:#3a60d8; --primary-ink:#ffffff; --link:#8fb0ff; --tint:rgba(143,176,255,.14);
    --good:#34c77b; --good-soft:#12301f; --warn:#ffb340; --warn-soft:#3a2a0c; --bad:#ff7a6e; --bad-soft:#40201c;
    --good-s:#34c77b; --warn-s:#ffb340; --bad-s:#ff6b5e; --on-s:#101010;
    --fill:rgba(118,118,128,.28); --seg-on:#636366; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --ink:#f2f2f7; --muted:#98989f; --sep:rgba(255,255,255,.14);
  --nav:#0f1a3d; --nav-ink:#ffffff;
  --primary:#3a60d8; --primary-ink:#ffffff; --link:#8fb0ff; --tint:rgba(143,176,255,.14);
  --good:#34c77b; --good-soft:#12301f; --warn:#ffb340; --warn-soft:#3a2a0c; --bad:#ff7a6e; --bad-soft:#40201c;
  --good-s:#34c77b; --warn-s:#ffb340; --bad-s:#ff6b5e; --on-s:#101010;
  --fill:rgba(118,118,128,.28); --seg-on:#636366; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.35 var(--sys);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* Title bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-ink);border-bottom:3px solid var(--gold)}
.nav-in{max-width:680px;margin:0 auto;padding:8px 8px;min-height:52px;display:grid;grid-template-columns:96px 1fr 96px;align-items:center}
.nt{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.nt b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nt span{font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nb button{background:none;border:0;color:var(--nav-ink);font-size:17px;padding:8px;display:inline-flex;align-items:center;gap:2px}
.nb button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(0,0,0,.08);z-index:9999;padding-top:env(safe-area-inset-top,0)}
.prog i{display:block;height:4px;background:#1faa59;width:0;transition:width .25s}

.page{max-width:680px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:6px}
body.has-tabs .page{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body.is-check .page{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tb[hidden]{display:none}
.ac-list{margin-top:6px;border:1px solid var(--sep);border-radius:12px;background:var(--surface);max-height:min(44vh,300px);overflow:auto;-webkit-overflow-scrolling:touch}
.ac-list[hidden]{display:none}
.ac-opt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--sep);padding:12px 14px;min-height:44px;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.ac-opt:last-child{border-bottom:0}
.ac-opt[aria-selected="true"],.ac-opt:active{background:var(--tint)}
.ac-opt mark{background:none;color:var(--link);font-weight:700}
.ac-none{padding:12px 14px;color:var(--muted);font-size:14px}
.crow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--sep)}
.crow:last-of-type{border-bottom:0}
.crow .k{font-weight:600;flex:none;white-space:nowrap}.crow .v{color:var(--muted);font-size:14px;text-align:right;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.on{background:var(--good-soft);color:var(--good)}.pill.off{background:var(--bad-soft);color:var(--bad)}.pill.mid{background:var(--warn-soft);color:var(--warn)}
.fld{width:100%;border:1px solid var(--sep);border-radius:10px;background:var(--bg);padding:11px 12px;font-size:16px;margin-top:6px}
.fld-l{font-weight:600;font-size:14px}
.stampnote{font-size:12px;color:var(--muted)}
.tb{background:none;border:0;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-selected="true"]{color:var(--link)}

/* Grouped lists */
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 16px 6px;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.sh .r{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0}
.group{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.group>*+*{border-top:1px solid var(--sep)}
.pad{padding:12px 16px}
.foot{padding:8px 16px 0;font-size:13px;color:var(--muted)}
.big-h{font-size:28px;font-weight:700;letter-spacing:-.01em;padding:6px 2px 0}
.lead{color:var(--muted);padding:0 2px 8px}

/* Buttons */
.btn{min-height:50px;padding:0 18px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-ink);font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.block{width:100%}
.btn.tint{background:var(--tint);color:var(--link)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.lnk{background:none;border:0;padding:6px 2px;color:var(--link);font-size:15px;font-weight:500}
.lnk[disabled]{opacity:.4}
label.lnk{display:inline-flex;align-items:center;gap:4px;cursor:pointer}

/* Segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.segb{min-height:36px;border:0;background:none;border-radius:7px;font-size:15px;font-weight:600}
.segb.on{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* Chips and pills */
.chip{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-block;min-width:54px;text-align:center;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700;background:var(--fill);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:15px}
.notice.good{background:var(--good-soft);color:var(--good)} .notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sep);margin-right:8px}
.dot.good{background:var(--good-s)} .dot.warn{background:var(--warn-s)}

/* Area cards */
.area{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:14px;padding:18px 16px 8px;box-shadow:var(--shadow)}
.area .top{display:flex;justify-content:space-between;align-items:center}
.area h3{font-size:26px;font-weight:700;letter-spacing:-.01em}
.area svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.area .sl{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:16px}
.area .sl+.sl{border-top:1px solid var(--sep)}
.area .sl small{color:var(--muted);font-size:14px}
.areas{display:flex;flex-direction:column;gap:12px}

/* Form rows */
.frow{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px}
.frow label{flex:0 0 108px;font-weight:500}
.frow input{flex:1 1 auto;min-width:0;border:0;background:transparent;padding:14px 0;font-size:17px;text-align:right}
.frow input::placeholder{color:var(--muted);opacity:.7}
.frow.info{justify-content:space-between}
.frow.info span:last-child{color:var(--muted);text-align:right}
input[type="date"].dt{border:0;background:transparent;font-size:17px;color:var(--link);padding:12px 0;text-align:right;min-height:48px}

/* Checklist */
.chk{padding:12px 14px 10px 16px;display:flex;flex-direction:column;gap:6px}
.chk.flag{background:var(--bad-soft)}
.chk-main{display:flex;gap:14px;align-items:center}
.ct{flex:1 1 auto;min-width:0;font-size:16px;overflow-wrap:anywhere}
.cid{display:inline-block;min-width:24px;margin-right:8px;font-size:13px;font-weight:700;color:var(--muted)}
.crit{display:inline-block;margin-left:8px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--bad);background:var(--bad-soft);vertical-align:1px}
.dial{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--sep);background:var(--fill);color:var(--muted);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.dial.on{border-color:transparent;color:var(--on-s)}
.dial.on.full{background:var(--good-s)} .dial.on.part{background:var(--warn-s)} .dial.on.zero{background:var(--bad-s)}
.dial[disabled]{cursor:default;opacity:.9}
.chk-acts{display:flex;gap:16px;align-items:center;padding-left:32px}
.note{width:100%;border:1px solid var(--sep);border-radius:10px;background:var(--bg);padding:10px 12px;resize:vertical;min-height:60px;font-size:16px}
.hint{font-size:13px;font-weight:600;color:var(--warn)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--fill)}
.th img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.th button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;padding:0}
.chk-x{display:flex;flex-direction:column;gap:8px;padding-left:32px}

/* Score bar */
.scorebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--sep);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.scorebar .in{max-width:680px;margin:0 auto;padding:0 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.scorebar .sc{font-size:22px;font-weight:700}
.scorebar .sc small{font-size:15px;font-weight:500;color:var(--muted)}
.scorebar .sub{font-size:13px;color:var(--muted)}
.scorebar .btn{min-height:46px;padding:0 20px;white-space:nowrap;flex:none}

/* Overview / report rows */
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px}
.li .m{flex:1 1 auto;min-width:0}
.li .t{font-size:17px;font-weight:600}
.li .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.li svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sum{display:flex;gap:14px;align-items:center;padding:14px 16px}
.sum b{font-size:36px;font-weight:700;line-height:1}
.sum b.good{color:var(--good)} .sum b.warn{color:var(--warn)} .sum b.bad{color:var(--bad)} .sum b.none{color:var(--muted)}
.sum span{color:var(--muted);font-size:15px}
.gp{padding:12px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gp .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gp p{overflow-wrap:anywhere;font-size:16px}
.gp .rem{font-weight:600}
.gp .nr{color:var(--muted);font-size:14px}
.empty{text-align:center;padding:22px 12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--sep);white-space:nowrap}
th{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrapc{white-space:normal;min-width:200px}
.cell{display:inline-block;min-width:54px;text-align:center;border:0;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;background:var(--fill);color:var(--muted)}
.cell.good{background:var(--good-soft);color:var(--good)} .cell.warn{background:var(--warn-soft);color:var(--warn)} .cell.bad{background:var(--bad-soft);color:var(--bad)}
.cell.miss{background:transparent;border:1px dashed var(--sep);font-weight:500}
pre.txt{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0;padding:12px 16px}
details summary{padding:12px 16px;cursor:pointer;color:var(--link);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:rgba(40,40,44,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;font-weight:500;z-index:90}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:95;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#000;font-size:24px}

/* Picker sheet and cylinder wheel */
.sheet-back{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .22s}
.sheet-back.open{background:rgba(0,0,0,.4)}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet-back.open .sheet{transform:translateY(0)}
.sh-bar{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--sep)}
.sh-title{text-align:center;font-weight:700}
.tbtn{background:none;border:0;color:var(--link);font-size:17px;padding:10px 8px}
.tbtn.strong{font-weight:700;text-align:right}
.tbtn:first-child{text-align:left}
.sh-q{padding:12px 18px 2px;font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.pk{position:relative;height:230px;margin:6px 0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.pk:active{cursor:grabbing}
.pk-band{position:absolute;left:14px;right:14px;top:50%;height:46px;margin-top:-23px;border-radius:10px;background:var(--fill)}
.pk-d{position:absolute;inset:0;perspective:300px;perspective-origin:50% 50%}
.pk-i{position:absolute;left:0;right:0;top:50%;height:46px;margin-top:-23px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;backface-visibility:hidden;will-change:transform,opacity}
.pk-i.ghost{color:var(--muted);font-size:26px}
.pk.full .pk-i.sel{color:var(--good-s)} .pk.part .pk-i.sel{color:var(--warn-s)} .pk.zero .pk-i.sel{color:var(--bad-s)}
.pk::before,.pk::after{content:"";position:absolute;left:0;right:0;height:72px;z-index:2;pointer-events:none}
.pk::before{top:0;background:linear-gradient(var(--surface),transparent)}
.pk::after{bottom:0;background:linear-gradient(transparent,var(--surface))}
.pk:focus-visible{outline-offset:-3px}
.pk-cap{text-align:center;font-weight:600;min-height:24px}
.pk-foot{display:flex;justify-content:center;padding-top:2px}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-back,.prog i{transition:none}}
body{overflow-x:hidden;overflow-wrap:anywhere}
.nb button{white-space:nowrap}.nb button span{white-space:nowrap}
</style></head><body>
<header class="nav" id="nav"></header>
<div class="prog" id="prog" hidden><i></i></div>
<main class="page" id="view" aria-live="polite"></main>
<div class="scorebar" id="bar" hidden>
  <div class="in">
    <div>
      <div class="sc"><span id="bar-got">0</span><small> / <span id="bar-total">118</span> <span id="bar-pct"></span></small></div>
      <div class="sub"><span id="bar-ans"></span><span id="bar-save"></span></div>
    </div>
    <button class="btn" id="bar-submit" type="button">Submit audit</button>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections">
  <div class="in" role="tablist">
    <button class="tb" role="tab" id="tab-log" data-tab="log"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M7 6H6a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1"/><path d="m9 14 2 2 4-4"/></svg>Log audit</button>
    <button class="tb" role="tab" id="tab-overview" data-tab="overview"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Overview</button>
    <button class="tb" role="tab" id="tab-report" data-tab="report"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 17v-3M12 17v-5M15 17v-2"/></svg>Report</button>
    <button class="tb" role="tab" id="tab-settings" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
    <button class="tb" role="tab" id="tab-admin" data-tab="admin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Admin</button>
  </div>

async function compress(file,maxSide,quality,stamp){

/* ---------- Roller picker (bottom sheet with cylinder wheel) ---------- */
var PK=null;
function openPicker(q){
  if(!editable()||PK)return;
  var vals=[];for(var i=0;i<=q.max;i++)vals.push(i);
  var cur=E.scores[q.id];
  var pos=typeof cur==='number'?cur:q.max;   /* opens on full marks, the usual answer */
  var ROW=46,RAD=30*Math.PI/180,R=ROW/RAD;
  var rows=[null,null].concat(vals,[null,null]);   /* dotted ghost rows above and below keep the drum visible */
  var items=rows.map(function(v){return el('div',{class:'pk-i'+(v===null?' ghost':''),text:v===null?'·':String(v)});});
  var drum=el('div',{class:'pk-d'},items);
  var wheel=el('div',{class:'pk',role:'spinbutton',tabindex:'0','aria-label':'Score for point '+q.id,'aria-valuemin':'0','aria-valuemax':String(q.max)},el('div',{class:'pk-band'}),drum);
  var cap=el('div',{class:'pk-cap'});
  var lastIdx=-1,raf=null,dragging=false,moved=0,lastY=0,lastT=0,vel=0,acc=0;
  function idxNow(){return Math.max(0,Math.min(vals.length-1,Math.round(pos)));}
  function paint(){
    var idx=idxNow();
    for(var i=0;i<items.length;i++){
      var a=(i-2-pos)*RAD;
      if(Math.abs(a)>=1.45){items[i].style.visibility='hidden';continue;}
      items[i].style.visibility='visible';
      items[i].style.transform='translateY('+(R*Math.sin(a)).toFixed(2)+'px) rotateX('+(-a*57.2958).toFixed(2)+'deg)';
      items[i].style.opacity=Math.pow(Math.cos(a),3).toFixed(3);
      items[i].classList.toggle('sel',i-2===idx);
    }
    if(idx!==lastIdx){
      if(lastIdx!==-1){try{if(navigator.vibrate)navigator.vibrate(6);}catch(e){}}
      lastIdx=idx;var val=vals[idx];
      wheel.classList.remove('full','part','zero');
      wheel.classList.add(val===q.max?'full':val===0?'zero':'part');
      cap.textContent=val+' of '+q.max+' · '+(val===q.max?'Full marks':val===0?'No marks':'Partial marks');
      wheel.setAttribute('aria-valuenow',String(val));
      wheel.setAttribute('aria-valuetext',cap.textContent);
    }
  }
  function animate(target,dur){
    cancelAnimationFrame(raf);
    var from=pos,t0=performance.now();
    function step(now){
      var t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3);
      pos=from+(target-from)*e;paint();
      if(t<1)raf=requestAnimationFrame(step);
    }
    raf=requestAnimationFrame(step);
  }
  function goTo(t){t=Math.max(0,Math.min(vals.length-1,t));animate(t,Math.max(180,Math.min(520,Math.abs(t-pos)*170+160)));}
  wheel.addEventListener('pointerdown',function(ev){
    dragging=true;moved=0;lastY=ev.clientY;lastT=ev.timeStamp;vel=0;
    cancelAnimationFrame(raf);
    try{wheel.setPointerCapture(ev.pointerId);}catch(e){}
  });
  wheel.addEventListener('pointermove',function(ev){
    if(!dragging)return;
    var dy=ev.clientY-lastY;moved+=Math.abs(dy);
    var d=-dy/ROW;var np=pos+d;
    if(np<0||np>vals.length-1)np=pos+d*0.35;
    pos=np;
    var dt=Math.max(1,ev.timeStamp-lastT);vel=0.75*vel+0.25*(d/dt);
    lastY=ev.clientY;lastT=ev.timeStamp;paint();
  });
  function end(ev){
    if(!dragging)return;dragging=false;
    if(moved<6){
      var rect=wheel.getBoundingClientRect();
      var yy=ev.clientY-(rect.top+rect.height/2);
      var a=Math.asin(Math.max(-1,Math.min(1,yy/R)));
      goTo(Math.round(pos+a/RAD));return;
    }
    goTo(Math.round(pos+vel*220));
  }
  wheel.addEventListener('pointerup',end);
  wheel.addEventListener('pointercancel',end);
  wheel.addEventListener('wheel',function(ev){
    ev.preventDefault();acc+=ev.deltaY;
    if(Math.abs(acc)>=40){goTo(idxNow()+(acc>0?1:-1));acc=0;}
  },{passive:false});
  wheel.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowUp'){ev.preventDefault();goTo(idxNow()-1);}
    else if(ev.key==='ArrowDown'){ev.preventDefault();goTo(idxNow()+1);}
    else if(ev.key==='Enter'){ev.preventDefault();close(true);}
  });
  var back=el('div',{class:'sheet-back',onclick:function(ev){if(ev.target===back)close(false);}});
  var sheet=el('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':'Score for point '+q.id},
    el('div',{class:'sh-bar'},
      el('button',{type:'button',class:'tbtn',text:'Cancel',onclick:function(){close(false);}}),
      el('div',{class:'sh-title',text:'Point '+q.id+' · out of '+q.max}),
      el('button',{type:'button',class:'tbtn strong',text:'Done',onclick:function(){close(true);}})),
    el('p',{class:'sh-q'},q.text,q.crit?el('span',{class:'crit',text:'Critical'}):null),
    wheel,cap,
    el('div',{class:'pk-foot'},typeof cur==='number'?el('button',{type:'button',class:'lnk',text:'Clear score',onclick:function(){setScore(q,null);close(false);}}):null));
  back.append(sheet);
  document.body.append(back);document.body.classList.add('lock');
  PK={close:close};
  paint();
  requestAnimationFrame(function(){back.classList.add('open');wheel.focus({preventScroll:true});});
  function close(commit){
    if(!PK)return;
    cancelAnimationFrame(raf);
    if(commit)setScore(q,vals[idxNow()]);
    PK=null;back.classList.remove('open');document.body.classList.remove('lock');
    setTimeout(function(){back.remove();},260);
    var c=CARDS[q.id];if(c&&c.dial)try{c.dial.focus({preventScroll:true});}catch(e){}
  }
}

  if(e.key!=='Escape')return;

  if(PK)PK.close(false);

function cinemaPicker(initial,onPick){
  var picked=initial||'',act=-1,items=[];
  var inp=el('input',{class:'fld',id:'cin-in',type:'text',role:'combobox','aria-expanded':'false','aria-autocomplete':'list','aria-controls':'cin-list',placeholder:'Type to search, for example whitefield',autocomplete:'off',autocapitalize:'off',spellcheck:'false',value:picked});
  var list=el('div',{class:'ac-list',id:'cin-list',role:'listbox',hidden:true});
  var wrap=el('div',{},inp,list);
  function close(){list.hidden=true;inp.setAttribute('aria-expanded','false');act=-1;}
  function pick(c){picked=c;inp.value=c;close();if(onPick)onPick(c);}
  function mark(opt,c,q){
    if(!q){opt.textContent=c;return;}
    var i=c.toLowerCase().indexOf(q);
    if(i<0){opt.textContent=c;return;}
    opt.append(document.createTextNode(c.slice(0,i)),el('mark',{text:c.slice(i,i+q.length)}),document.createTextNode(c.slice(i+q.length)));
  }
  function open(){
    var q=inp.value.trim().toLowerCase();
    items=CINEMAS.filter(function(c){return !q||c.toLowerCase().indexOf(q)>=0;});
    list.textContent='';act=-1;
    if(!items.length)list.append(el('div',{class:'ac-none',text:'No cinema matches. Pick one from the list.'}));
    items.forEach(function(c,i){
      var o=el('button',{type:'button',class:'ac-opt',role:'option',id:'cin-o'+i,'aria-selected':'false'});
      mark(o,c,q);
      o.addEventListener('pointerdown',function(ev){ev.preventDefault();});
      o.addEventListener('click',function(){pick(c);});
      list.append(o);
    });
    list.hidden=false;inp.setAttribute('aria-expanded','true');
  }
  function move(d){
    if(list.hidden)open();
    if(!items.length)return;
    act=(act+d+items.length)%items.length;
    [].forEach.call(list.querySelectorAll('.ac-opt'),function(o,i){o.setAttribute('aria-selected',String(i===act));if(i===act){o.scrollIntoView({block:'nearest'});inp.setAttribute('aria-activedescendant',o.id);}});
  }
  inp.addEventListener('input',open);
  inp.addEventListener('focus',open);
  inp.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowDown'){ev.preventDefault();move(1);}
    else if(ev.key==='ArrowUp'){ev.preventDefault();move(-1);}
    else if(ev.key==='Enter'){ev.preventDefault();if(act>=0&&items[act])pick(items[act]);}
    else if(ev.key==='Escape'){close();inp.value=picked;}
  });
  inp.addEventListener('blur',function(){setTimeout(function(){close();inp.value=picked;},120);});   /* free text is never kept */
  return wrap;
}

      catch(err){toast(err&&err.code==='locked'?'Too many tries. Ask for a new code.':'That code is not right.');}}});
    v.append(sh('Admin sign-in'));
    v.append(group(el('div',{class:'pad'},el('p',{text:'Admin settings are protected by a one-time code sent to the admin email. Until an admin email is saved, the code goes to the Google account that owns the connection.'}),
      el('div',{style:'margin-top:12px'},sendBtn),el('label',{class:'fld-l',for:'ad-otp',style:'display:block;margin-top:14px',text:'Enter code'}),otp,el('div',{style:'margin-top:10px'},okBtn))));
    return;
  }
  v.append(group(el('div',{class:'empty',text:'Loading…'})));
  Promise.all([api('cfgGet'),api('adminStats'),api('adminLocks')]).then(function(rs){
    if(S.tab!=='admin')return;
    var c=rs[0].cfg,st=rs[1],lk=rs[2].locks||[];
    var num=function(id,val,lo,hi,step){return el('input',{id:id,class:'fld',type:'number',min:String(lo),max:String(hi),step:String(step||1),value:String(val)});};
    var lt=num('cf-lt',c.leaseTtl==null?300:c.leaseTtl,60,1800),lw=num('cf-lw',c.lockWait==null?10:c.lockWait,2,30),rt=num('cf-rt',c.readTtl==null?25:c.readTtl,0,120);
    var sl=el('input',{id:'cf-sl',type:'checkbox'});sl.checked=c.sectionLocks!==false;
    var rec=el('input',{id:'cf-rec',class:'fld',type:'email',value:c.recipient||'',placeholder:'Where reports are sent',autocomplete:'off'});
    var adm=el('input',{id:'cf-adm',class:'fld',type:'email',inputmode:'email',value:c.adminEmail||'',placeholder:'name@example.com',autocomplete:'off',autocapitalize:'off'});
    var admMsg=el('div',{class:'stampnote',id:'cf-adm-msg',role:'status',style:'margin-top:8px',text:c.adminEmail?'Sign-in codes are sent to this address.':'No admin email saved yet. Until you save one, sign-in codes go to the Google account that owns the connection.'});
    var admBtn=el('button',{type:'button',class:'btn sm',text:'Save admin email',onclick:async function(){
      var val=adm.value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)){admMsg.className='notice bad';admMsg.textContent='Enter a valid email address.';toast('Enter a valid email address.');return;}
      admBtn.disabled=true;
      try{await api('adminEmailSet',{adminEmail:val});admMsg.className='notice good';admMsg.textContent='Admin email saved. Sign-in codes now go to '+val+'.';toast('Admin email saved.');}
      catch(err){var m=err&&err.code==='invalid'?'Enter a valid email address.':'Could not save the admin email.';admMsg.className='notice bad';admMsg.textContent=m;toast(m);}
      admBtn.disabled=false;}});
    var keep=el('input',{id:'cf-keep',class:'fld',type:'number',min:'0',max:'365',value:String(c.keepDays)});
    var code=el('input',{id:'cf-code',class:'fld',type:'text',maxlength:'20',value:c.accessCode||'',placeholder:'Leave empty for no code',autocomplete:'off'});
    var flushBtn=el('button',{type:'button',class:'btn sm',text:'Flush photos older than '+c.keepDays+' days',onclick:async function(){
      if(flushBtn.dataset.armed!=='1'){flushBtn.dataset.armed='1';flushBtn.textContent='Tap again to delete the photos';setTimeout(function(){if(flushBtn.isConnected){flushBtn.dataset.armed='0';flushBtn.textContent='Flush photos older than '+c.keepDays+' days';}},5000);return;}
      flushBtn.disabled=true;flushBtn.textContent='Flushing…';
      try{var r=await api('flush');toast('Photos flushed from '+r.audits+' audit'+(r.audits===1?'':'s')+'.');render();}catch(err){toast('Could not flush.');flushBtn.disabled=false;}}});
    v.textContent='';
    v.append(sh('Admin email'));
    v.append(group(el('div',{class:'pad'},
      el('label',{class:'fld-l',for:'cf-adm',text:'Admin email (receives sign-in codes)'}),adm,
      el('div',{style:'margin-top:10px'},admBtn),admMsg)));
    v.append(sh('Report email'));
    v.append(group(el('div',{class:'pad'},
      el('label',{class:'fld-l',for:'cf-rec',text:'Send reports to'}),rec,
      el('label',{class:'fld-l',for:'cf-keep',style:'display:block;margin-top:12px',text:'Keep photos for (days, 0 = delete right after emailing)'}),keep,
      el('label',{class:'fld-l',for:'cf-code',style:'display:block;margin-top:12px',text:'Staff access code'}),code,
      el('div',{style:'margin-top:14px'},el('button',{type:'button',class:'btn sm',text:'Save settings',onclick:async function(){
        try{await api('cfgSet',{recipient:rec.value.trim(),keepDays:parseInt(keep.value,10),accessCode:code.value.trim(),leaseTtl:parseInt(lt.value,10),lockWait:parseInt(lw.value,10),readTtl:parseInt(rt.value,10),sectionLocks:sl.checked});toast('Settings saved.');}
        catch(err){toast(err&&err.code==='invalid'?(err.message||'Check the values.'):'Could not save.');}}})))));
    v.append(el('div',{class:'foot',text:'If you change the staff access code, each phone asks for the new code on its next use.'}));
    v.append(sh('Shared checklist control'));
    v.append(group(el('div',{class:'pad'},
      el('label',{style:'display:flex;gap:10px;align-items:center;font-weight:600'},sl,el('span',{text:'Lock each section to one person at a time'})),
      el('p',{class:'stampnote',text:'On: the first person to edit a section holds it; others can fill the other sections. Off: anyone can edit anything and the last save wins.'}),
      el('label',{class:'fld-l',for:'cf-lt',style:'display:block;margin-top:12px',text:'Section lock time-out (seconds, 60 to 1800)'}),lt,
      el('label',{class:'fld-l',for:'cf-lw',style:'display:block;margin-top:12px',text:'Save wait when busy (seconds, 2 to 30)'}),lw,
      el('label',{class:'fld-l',for:'cf-rt',style:'display:block;margin-top:12px',text:'Read cache (seconds, 0 to 120, 0 = off)'}),rt,
      el('p',{class:'stampnote',text:'Time-out frees a section if a phone goes quiet. Save wait is how long a save queues behind another before asking to retry. Use Save settings above to apply.'}),
      el('div',{style:'margin-top:10px'},el('button',{type:'button',class:'btn sm',text:'Refresh read cache now',onclick:async function(){
        try{await api('clearCache');toast('Read cache refreshed.');}catch(err){toast('Could not refresh.');}}})))));
    var lkKids=[el('b',{text:lk.length?lk.length+' section'+(lk.length===1?'':'s')+' held right now':'No sections held right now'})];
    lk.forEach(function(l){
      lkKids.push(el('div',{style:'display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px'},
        el('span',{style:'min-width:0;overflow-wrap:anywhere',text:l.area+' · '+l.leg+' · '+(l.name||'someone')+' · '+l.ageSec+'s'}),
        el('button',{type:'button',class:'btn sm',text:'Release',onclick:async function(){
          try{await api('releaseLocks',{key:l.key});toast('Released.');render();}catch(err){toast('Could not release.');}}})));});
    if(lk.length)lkKids.push(el('div',{style:'margin-top:12px'},el('button',{type:'button',class:'btn sm',text:'Release all section locks',onclick:async function(){
      try{var r=await api('releaseLocks');toast(r.released+' released.');render();}catch(err){toast('Could not release.');}}})));
    v.append(group(el('div',{class:'pad'},lkKids)));
    v.append(sh('Storage'));
    v.append(group(el('div',{class:'pad'},
      el('p',{text:st.photos+' photo'+(st.photos===1?'':'s')+' stored ('+st.mb+' MB). '+st.audits+' audit'+(st.audits===1?'':'s')+' recorded in total.'}),
      el('p',{class:'stampnote',text:'Flushing deletes only photo files. Scores, remarks, names and times stay forever in the audit sheet. A daily job also flushes old photos automatically.'}),
      el('div',{style:'margin-top:10px'},flushBtn),
      API_URL==='sandbox'?null:el('div',{style:'margin-top:10px'},el('button',{type:'button',class:'btn sm',text:'Send test email (photos + Excel)',onclick:async function(ev){
        var b=ev.currentTarget;b.disabled=true;
        try{var r=await api('testMail',{cinema:CINEMA});toast('Test email sent to '+r.recipient+'.');}catch(err){toast('Could not send the test email.');}
        b.disabled=false;}})),
      el('div',{style:'margin-top:10px'},el('button',{type:'button',class:'lnk',text:'Sign out',onclick:function(){TOKEN=null;render();}})))));
  }).catch(function(err){
    if(err&&err.code==='auth'){TOKEN=null;toast('Session expired. Sign in again.');render();}
    else{v.textContent='';v.append(group(el('div',{class:'empty',text:'Could not load settings.'})));}
  });
}

/* ---------- Shell ---------- */
function setNav(){
  var n=$('#nav');n.textContent='';
  var back=null,sub='Food Safety Audit';
  if(S.tab==='overview'){sub='Overview';}
  else if(S.tab==='report'){sub='Report';}
  else if(S.tab==='settings'){sub='Settings';}
  else if(S.tab==='admin'){sub='Admin';}
  else if(S.step==='details'){back={fn:function(){grabDF();S.step='area';render();}};sub=DEPTS[S.dept]+' · Your details';}
  else if(S.step==='check'){back={fn:leaveCheck};sub=DEPTS[S.dept]+' · '+SHIFTS[S.shift]+' · '+fmtShort(S.date);}
  var left=el('div',{class:'nb'});
  if(back)left.append(el('button',{type:'button','aria-label':'Back to areas',onclick:back.fn,html:CHEVL+'<span>Areas</span>'}));
  var cb=el('b',{text:cname(),title:cname()});if(cname().length>22){cb.style.cssText='font-size:13px;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden';}
  n.append(el('div',{class:'nav-in',style:back?'':'grid-template-columns:8px 1fr 8px'},left,el('div',{class:'nt'},cb,el('span',{text:sub+(window.APP_ENV?' · '+window.APP_ENV:'')})),el('div',{class:'nb'})));
}
var renderTimer=null;
function render(){
  var v=$('#view');v.textContent='';
  var isCheck=S.tab==='log'&&S.step==='check';
  var deep=S.tab==='log'&&S.step!=='area';
  document.body.classList.toggle('is-check',isCheck);
  document.body.classList.toggle('has-tabs',!deep);
  $('#tabbar').hidden=deep;
  $('#bar').hidden=!(isCheck&&E);
  $('#prog').hidden=!(isCheck&&E);
  ['log','overview','report','settings','admin'].forEach(function(t){$('#tab-'+t).setAttribute('aria-selected',String(S.tab===t));});
  setNav();
  if(S.tab==='log'){
    if(S.step==='area')renderArea(v);
    else if(S.step==='details')renderDetails(v);
    else renderCheck(v);
  }else if(S.tab==='overview')renderOverview(v);
  else if(S.tab==='settings')renderSettings(v);
  else if(S.tab==='admin')renderAdmin(v);
  else{if(loadedFrom&&S.from<loadedFrom)poll();renderReport(v);}
}
function renderSoon(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(function(){if(PK||S.tab==='admin')return;if(S.tab!=='log'||S.step==='area')render();},150);
}
document.querySelectorAll('.tb').forEach(function(b){
  b.addEventListener('click',async function(){
    var t=b.dataset.tab;
    if(t===S.tab){if(t==='log'&&S.step!=='area'){}return;}
    if(S.tab==='log'&&S.step==='check')await flushNow();
    S.tab=t;
    if(t==='log'&&S.step!=='area'){S.step='area';E=null;}
    render();
  });
});
$('#bar-submit').addEventListener('click',submitAudit);
document.addEventListener('visibilitychange',function(){if(document.hidden)flushNow();});

var pollBusy=false,loadedFrom='';
async function poll(){
  if(pollBusy||!API_URL)return;pollBusy=true;
  try{
    var from=S.from<addDays(today,-35)?S.from:addDays(today,-35);
    var r=await api('list',{from:from});loadedFrom=from;
    ADX=new Map();A=[];
    r.entries.forEach(function(x){ADX.set(x.key,x);A.push(x);});
    if(E&&ADX.get(E.key)){LEASES=ADX.get(E.key).leases||{};if(S.step==='check')updateSectionProgress();}
    S.live=true;renderSoon();
  }catch(err){S.live=false;if(err&&err.code==='bad_code'){NEEDCODE=true;if(S.tab!=='settings'){S.tab='settings';toast('An access code is needed. Enter it under Connections.');}render();}}
  pollBusy=false;
}
function needCode(){NEEDCODE=true;if(S.tab!=='settings'){S.tab='settings';toast('An access code is needed. Enter it under Connections.');render();}}
var syncOn=false;
function startSync(){
  if(syncOn||!API_URL)return;syncOn=true;
  poll();setInterval(poll,30000);
  setInterval(function(){if(!API_URL||!E||!db||!myMask||document.hidden||S.step!=='check'||E.status==='submitted')return;api('claim',{key:E.key,uid:uid,name:(E.emp&&E.emp.name)||EMP.name||'',mask:myMask}).then(function(r){if(r&&r.leases)LEASES=r.leases;}).catch(function(){});},100000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
}
function loadCfg(){
  if(!API_URL)return;
  api('cfg').then(function(r){if(typeof r.keepDays==='number')CFG.keepDays=r.keepDays;}).catch(function(err){if(err&&err.code==='bad_code'){NEEDCODE=true;}});
}
async function init(){
  uid=lsGet('fsa-dev');if(!uid){uid='dev-'+uidStr();lsSet('fsa-dev',uid);}
  if(!CINEMA)S.tab=API_URL?'log':'settings';
  else if(!API_URL)S.tab='settings';
  render();
  if(!CINEMA)showCinemaGate();
  startSync();loadCfg();
}
init();
})();
</script>
